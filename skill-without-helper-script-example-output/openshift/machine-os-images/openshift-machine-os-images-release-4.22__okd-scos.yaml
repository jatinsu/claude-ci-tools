base_images:
  origin_scos-4.22_base-stream9:
    namespace: origin
    name: scos-4.22
    tag: base-stream9
  origin_scos-4.22_cli:
    namespace: origin
    name: scos-4.22
    tag: cli
  origin_scos-4.22_installer:
    namespace: origin
    name: scos-4.22
    tag: installer
build_root:
  image_stream_tag:
    namespace: ocp
    name: builder
    tag: rhel-9-golang-1.25-openshift-4.22
images:
- build_args:
  - name: TAGS
    value: scos
  - name: DIRECT_DOWNLOAD
    value: 'true'
  dockerfile_path: Dockerfile
  from: origin_scos-4.22_base-stream9
  inputs:
    origin_scos-4.22_installer:
      as:
      - builder
      - registry.ci.openshift.org/ocp/4.22:installer
    origin_scos-4.22_cli:
      as:
      - cli
      - registry.ci.openshift.org/ocp/4.22:cli
  to: machine-os-images
promotion:
  to:
  - namespace: origin
    name: scos-4.22
releases:
  latest:
    integration:
      namespace: origin
      name: scos-4.22
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
